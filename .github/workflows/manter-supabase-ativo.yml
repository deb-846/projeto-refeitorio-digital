# Impede que o projeto Supabase entre em repouso por inatividade.
#
# No plano gratuito o Supabase pausa o projeto após ~7 dias sem nenhuma
# requisição. Este workflow faz um "ping" a cada 2 dias, o que conta como
# atividade e mantém o banco acordado — inclusive em finais de semana,
# feriados e períodos de férias do refeitório.
#
# CONFIGURAÇÃO OBRIGATÓRIA (uma única vez):
#   Settings > Secrets and variables > Actions > New repository secret
#     SUPABASE_URL  -> https://xxxxxxxx.supabase.co
#     SUPABASE_KEY  -> a mesma chave anon usada nos Secrets do Streamlit
#   (opcional) STREAMLIT_APP_URL -> URL pública do totem, para acordar o app também
#
# ATENÇÃO: o GitHub desativa workflows agendados em repositórios sem commits
# por 60 dias. Se isso acontecer, basta reabilitar em Actions.

name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 12 */2 * *"   # a cada 2 dias, 12h17 UTC (~08h17 em Cuiabá)
  workflow_dispatch:           # permite disparar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
    steps:
      - name: Acordar o banco Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_KEY}" ]; then
            echo "::error::Secrets SUPABASE_URL e SUPABASE_KEY não configurados no repositório."
            exit 1
          fi

          url="${SUPABASE_URL%/}/rest/v1/colaboradores?select=nome&limit=1"

          # Um projeto em repouso pode levar 1-2 minutos para acordar,
          # por isso são várias tentativas com espera crescente.
          for tentativa in 1 2 3 4 5; do
            codigo=$(curl -s -o /tmp/resposta.txt -w "%{http_code}" \
              --max-time 60 \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              "$url" || echo "000")

            echo "Tentativa ${tentativa}: HTTP ${codigo}"

            # 2xx = ok. 401/403/404 também significam que o projeto respondeu
            # (está acordado), que é exatamente o objetivo deste ping.
            case "$codigo" in
              2*|401|403|404)
                echo "✅ Supabase respondeu — projeto ativo."
                exit 0
                ;;
            esac

            cat /tmp/resposta.txt || true
            sleep $((tentativa * 20))
          done

          echo "::error::Supabase não respondeu após 5 tentativas."
          exit 1

      - name: Acordar o app do totem (opcional)
        if: ${{ env.STREAMLIT_APP_URL != '' }}
        run: |
          curl -s -o /dev/null -w "Totem: HTTP %{http_code}\n" \
            --max-time 90 "${STREAMLIT_APP_URL}" || true
